name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 検査の抑制に理由があるか（CODE-06）。リポジトリ全体の *.py を1回で調べる
  suppressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun scripts/check-suppressions.ts

  check:
    runs-on: ubuntu-latest
    # プロジェクトを足したら、matrix に足す（REPO-04）
    strategy:
      matrix:
        project: [__PROJECT__]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Imports
        run: uv run lint-imports

      - name: Test
        run: uv run pytest
