name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # プロジェクトを足したら、matrix に足す（REPO-04）
    strategy:
      matrix:
        project: [__PROJECT__]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Imports
        run: uv run lint-imports

      # domain / use_case のカバレッジ閾値を割ると落ちる（TEST-05）
      - name: Test
        run: uv run pytest --cov
