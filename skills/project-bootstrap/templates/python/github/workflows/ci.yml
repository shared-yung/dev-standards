name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# トークンの権限をリポジトリ設定に頼らず、必要な分だけを明示する（REPO-07）
permissions:
  contents: read

jobs:
  # プロジェクトごとの検査。matrix のジョブは「project (<プロジェクト>)」の名前で報告される
  project:
    runs-on: ubuntu-latest
    # プロジェクトを足したら、matrix に足す（REPO-04）
    strategy:
      matrix:
        project: [__PROJECT__]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # 版を固定する（REPO-07）。latest にしない
          version: 0.13.0
          enable-cache: true

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      # 検査の抑制に理由があるか（CODE-06）。プロジェクトのフォルダで実行するので、その中の *.py だけを見る。
      # bun の版はルートの package.json の packageManager から読む
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Suppressions
        run: bun ../scripts/check-suppressions.ts

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Imports
        run: uv run lint-imports

      # domain / use_case のカバレッジ閾値を割ると落ちる（TEST-05）
      - name: Test
        run: uv run pytest --cov

  # ruleset の必須チェックは名前「check」で照合する（branch-protection-ruleset.json）。matrix のジョブは
  # 名前にプロジェクトが付いて一致しないので、全プロジェクトの結果をこのジョブにまとめる。
  # プロジェクトが落ちても（always）実行し、結果が success でなければ落ちる
  check:
    needs: project
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: すべてのプロジェクトの検査が通ったか
        run: test "${{ needs.project.result }}" = success
