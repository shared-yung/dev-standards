name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # プロジェクトごとの検査。matrix のジョブは「project (<プロジェクト>)」の名前で報告される
  project:
    runs-on: ubuntu-latest
    # プロジェクトを足したら、matrix に足す（REPO-04）
    strategy:
      matrix:
        project: [__PROJECT__]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      # 検査の抑制に理由があるか（CODE-06）。プロジェクトのフォルダで実行するので、その中の *.py だけを見る
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Suppressions
        run: bun ../scripts/check-suppressions.ts

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Imports
        run: uv run lint-imports

      # domain / use_case のカバレッジ閾値を割ると落ちる（TEST-05）
      - name: Test
        run: uv run pytest --cov

  # ruleset の必須チェックは名前「check」で照合する（branch-protection-ruleset.json）。matrix のジョブは
  # 名前にプロジェクトが付いて一致しないので、全プロジェクトの結果をこのジョブにまとめる。
  # プロジェクトが落ちても（always）実行し、結果が success でなければ落ちる
  check:
    needs: project
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: すべてのプロジェクトの検査が通ったか
        run: test "${{ needs.project.result }}" = success
