# Python プロジェクトの設定の雛形（stacks/python/）。リポジトリのルートの1階層下、`__PROJECT__/` に置く（REPO-04）
[project]
name = "__PROJECT__"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
__PROJECT__ = "__PACKAGE__.cli:main"

[dependency-groups]
dev = [
  # tests/test_architecture.py が import する（ARCH-04・ARCH-07）。import-linter の依存でもある
  "grimp>=3.17",
  # acyclic_siblings 契約（ARCH-09）は 2.15 で確かめた
  "import-linter>=2.15",
  "pyright>=1.1.406",
  "pytest>=8.4",
  "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# プロジェクト名（__PROJECT__）とパッケージ名（__PACKAGE__）が違っても wheel に入るように明示する
[tool.hatch.build.targets.wheel]
packages = ["src/__PACKAGE__"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT"]
extend-select = ["TID251", "TID252"]
# 文言・コメントは日本語で書くので、全角の括弧や読点を「紛らわしい文字」として扱わない
ignore = ["RUF001", "RUF002", "RUF003"]

# 親パッケージへの相対 import を禁じる。相対 import は同じパッケージの中だけ（ARCH-08）
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# 現在時刻・時間の経過・乱数は port で受け取る（CODE-07）
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "現在時刻は時計の port で受け取る（CODE-07）"
"time.time_ns".msg = "現在時刻は時計の port で受け取る（CODE-07）"
"time.monotonic".msg = "現在時刻は時計の port で受け取る（CODE-07）"
"time.perf_counter".msg = "現在時刻は時計の port で受け取る（CODE-07）"
"datetime.datetime.now".msg = "現在時刻は時計の port で受け取る（CODE-07）"
"datetime.datetime.utcnow".msg = "現在時刻は時計の port で受け取る（CODE-07）"
"datetime.datetime.today".msg = "現在時刻は時計の port で受け取る（CODE-07）"
"datetime.date.today".msg = "現在時刻は時計の port で受け取る（CODE-07）"
"time.sleep".msg = "時間の経過はタイマーの port で待つ（CODE-07）"
"asyncio.sleep".msg = "時間の経過はタイマーの port で待つ（CODE-07）"
"random".msg = "乱数は port で受け取る（CODE-07）"
"secrets".msg = "乱数は port で受け取る（CODE-07）"
"uuid.uuid1".msg = "乱数は port で受け取る（CODE-07）"
"uuid.uuid4".msg = "乱数は port で受け取る（CODE-07）"
"os.urandom".msg = "乱数は port で受け取る（CODE-07）"

[tool.ruff.lint.per-file-ignores]
# テスト名は日本語で書く（小文字・大文字の区別が無い）
"tests/**" = ["N802"]
# 時計・タイマー・乱数を直接使えるのは infrastructure だけ（テストも同じ層だけ）
"src/*/features/*/infrastructure/**" = ["TID251"]
"tests/**/infrastructure/**" = ["TID251"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.importlinter]
root_package = "__PACKAGE__"
include_external_packages = true

# 同じ親を持つモジュールどうしの循環を禁止する（ARCH-09）。layers 契約は層の中の循環を見ない
[[tool.importlinter.contracts]]
name = "循環: 同じ親を持つモジュールどうしが循環しない"
type = "acyclic_siblings"
ancestors = ["__PACKAGE__"]

# domain の外部依存（ARCH-04）と入口（ARCH-07）は tests/test_architecture.py で確かめる
# （import-linter の forbidden は禁止リストで、protected は要素ごとに契約を書くことになるため）

# feature を作ったら、feature ごとに containers へ足す（ARCH-01, ARCH-03）
# [[tool.importlinter.contracts]]
# name = "オニオン: 依存は外側から内側の一方向"
# type = "layers"
# containers = ["__PACKAGE__.features.<feature>"]
# layers = ["infrastructure", "use_case", "domain"]
