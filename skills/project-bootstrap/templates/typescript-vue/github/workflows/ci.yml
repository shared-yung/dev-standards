name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# トークンの権限をリポジトリ設定に頼らず、必要な分だけを明示する（REPO-07）
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 版は package.json の packageManager から読む
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # E2E も main に入る前に通す（TEST-05）。単体テストと並列に流す
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 版は package.json の packageManager から読む
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - name: Install browsers
        run: bun x playwright install --with-deps chromium
        working-directory: __PROJECT__

      - name: E2E
        run: bun run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-test-results
          path: __PROJECT__/test-results/
          retention-days: 7

  # ruleset の必須チェックは名前「check」で照合する（branch-protection-ruleset.json）。
  # 単体テストと E2E の結果をこのジョブにまとめる。どちらかが落ちても（always）実行し、
  # 両方が success でなければ落ちる
  check:
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 単体テストと E2E が通ったか
        run: test "${{ needs.unit.result }}" = success && test "${{ needs.e2e.result }}" = success
