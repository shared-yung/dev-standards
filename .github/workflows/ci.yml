name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: 規約（対応表・階層・radar・バンドル・サイズ）
        run: bun run check

      # dev-standards 自身も sync-repo の配布先。自分のテンプレートと食い違っていないかを確かめる
      - name: 自分自身への同期が最新か
        run: bun run sync-repo . --check

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
