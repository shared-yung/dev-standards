name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# トークンの権限をリポジトリ設定に頼らず、必要な分だけを明示する（REPO-07）
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 版は package.json の packageManager から読む
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - name: 規約（対応表・階層・radar・バンドル・サイズ）
        run: bun run check

      # dev-standards 自身も sync-repo の配布先。自分のテンプレートと食い違っていないかを確かめる
      - name: 自分自身への同期が最新か
        run: bun run sync-repo . --check

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
