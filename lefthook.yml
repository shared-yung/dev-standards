pre-commit:
  commands:
    format:
      glob: '*.{ts,js,mjs,json,md,yml,yaml}'
      run: bun x prettier --write {staged_files} && git add {staged_files}

commit-msg:
  commands:
    commitlint:
      run: sh scripts/commit-msg.sh {1}

# git pull の後に、マージ済みのローカルブランチを消す（WF-06）
post-merge:
  commands:
    prune-merged-branches:
      run: sh scripts/prune-merged-branches.sh

pre-push:
  commands:
    branch-name:
      run: sh scripts/check-branch-name.sh
