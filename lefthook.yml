# 共通の hook（commit-msg・post-merge・pre-push）は lefthook-dev-standards.yml にある（sync-repo が管理）。
# このファイルはプロジェクトのもの。スタック固有の hook をここに足す。
extends:
  - lefthook-dev-standards.yml

pre-commit:
  commands:
    format:
      glob: '*.{ts,js,mjs,json,md,yml,yaml}'
      run: bun x prettier --write {staged_files} && git add {staged_files}
